{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h2>Delete Member</h2>
    <div class="alert alert-danger">
        <p>Are you sure you want to permanently delete <strong>{{ member.name }}</strong>?</p>
        <p>This action will also remove all related incidents (shootings, murders, assists).</p>
        
        <form method="post">
            <button type="submit" class="btn btn-danger">Confirm Delete</button>
            <a href="{{ url_for('member_details', member_id=member.id) }}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
