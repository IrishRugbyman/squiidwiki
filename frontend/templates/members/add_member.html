{% extends "base.html" %}

{% block content %}
<div class="add-member-container">
    <div class="page-header">
        <h1 class="page-title">Add Member</h1>
        <h2 class="set-name">to {{ set_name }}</h2>
    </div>

    <div class="form-card">
        <form method="POST" action="/members/add/{{ set_id }}" id="add-member-form">
            <!-- Basic Information -->
            <div class="form-section">
                <h3 class="section-title">Basic Information</h3>
                
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" name="description" class="form-control" rows="3"></textarea>
                </div>
            </div>

            <!-- Status Information -->
            <div class="form-section">
                <h3 class="section-title">Status Information</h3>
                
                <div class="form-group">
                    <label for="status">Current Status</label>
                    <select id="status" name="status" class="form-control" required onchange="toggleFields()">
                        <option value="alive">Active</option>
                        <option value="locked_up">Locked Up</option>
                        <option value="dead">Deceased</option>
                    </select>
                </div>

                <!-- Release Date Section -->
                <div id="release_date_field" class="conditional-section" style="display: none;">
                    <h4 class="subsection-title">Release Date Information</h4>
                    
                    <div class="radio-group">
                        <label class="radio-option">
                            <input type="radio" id="release_exact_precision" name="release_date_precision" value="exact">
                            <div class="radio-content">
                                <div class="radio-title">Exact Date</div>
                                <div class="radio-description">You know the specific release date</div>
                            </div>
                        </label>

                        <label class="radio-option">
                            <input type="radio" id="release_year_precision" name="release_date_precision" value="year">
                            <div class="radio-content">
                                <div class="radio-title">Year Only</div>
                                <div class="radio-description">You only know the year of release</div>
                            </div>
                        </label>

                        <label class="radio-option">
                            <input type="radio" id="release_life_precision" name="release_date_precision" value="life">
                            <div class="radio-content">
                                <div class="radio-title">Life Sentence</div>
                                <div class="radio-description">Member is serving life in prison</div>
                            </div>
                        </label>

                        <label class="radio-option">
                            <input type="radio" id="release_unknown_precision" name="release_date_precision" value="unknown" checked>
                            <div class="radio-content">
                                <div class="radio-title">Unknown</div>
                                <div class="radio-description">Release date is not known</div>
                            </div>
                        </label>
                    </div>

                    <div id="release_exact_date_field" class="date-field" style="display: none;">
                        <div class="form-group">
                            <label for="release_date_exact">Exact Release Date</label>
                            <input type="date" id="release_date_exact" name="release_date_exact" class="form-control">
                        </div>
                    </div>

                    <div id="release_year_date_field" class="date-field" style="display: none;">
                        <div class="form-group">
                            <label for="release_date_year">Release Year</label>
                            <input type="number" id="release_date_year" name="release_date_year" class="form-control" placeholder="YYYY">
                        </div>
                    </div>
                </div>

                <!-- Death Date Section -->
                <div id="date_of_death_precision" class="conditional-section" style="display: none;">
                    <h4 class="subsection-title">Death Date Information</h4>
                    
                    <div class="radio-group">
                        <label class="radio-option">
                            <input type="radio" id="death_exact_precision" name="death_precision" value="exact">
                            <div class="radio-content">
                                <div class="radio-title">Exact Date</div>
                                <div class="radio-description">You know the specific date of death</div>
                            </div>
                        </label>

                        <label class="radio-option">
                            <input type="radio" id="death_year_precision" name="death_precision" value="year">
                            <div class="radio-content">
                                <div class="radio-title">Year Only</div>
                                <div class="radio-description">You only know the year of death</div>
                            </div>
                        </label>

                        <label class="radio-option">
                            <input type="radio" id="death_unknown_precision" name="death_precision" value="unknown" checked>
                            <div class="radio-content">
                                <div class="radio-title">Unknown</div>
                                <div class="radio-description">Date of death is not known</div>
                            </div>
                        </label>
                    </div>

                    <div id="death_exact_date_field" class="date-field" style="display: none;">
                        <div class="form-group">
                            <label for="death_date_exact">Exact Death Date</label>
                            <input type="date" id="death_date_exact" name="death_date_exact" class="form-control">
                        </div>
                    </div>

                    <div id="death_year_date_field" class="date-field" style="display: none;">
                        <div class="form-group">
                            <label for="death_date_year">Death Year</label>
                            <input type="number" id="death_date_year" name="death_date_year" class="form-control" placeholder="YYYY">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Alliance Information -->
            <div class="form-section">
                <h3 class="section-title">Alliance Information</h3>
                
                <div class="form-group">
                    <label for="alliance_id">Alliance (Optional)</label>
                    <select id="alliance_id" name="alliance_id" class="form-control">
                        <option value="">-- None --</option>
                    </select>
                    <small class="helper-text">Select an alliance if this member is part of one</small>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="submit-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                        <polyline points="17 21 17 13 7 13 7 21"></polyline>
                        <polyline points="7 3 7 8 15 8"></polyline>
                    </svg>
                    Create Member
                </button>
                <a href="/sets/{{ set_id }}" class="cancel-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>

<style>
:root {
    --card-hover-transform: translateY(-4px);
    --transition-speed: 0.3s;
}

.add-member-container {
    max-width: 800px;
    margin: 0 auto;
    padding: 2rem 1rem;
}

.page-header {
    text-align: center;
    margin-bottom: 2rem;
}

.page-title {
    color: var(--text-color);
    font-size: 2rem;
    font-weight: 700;
    margin: 0;
}

.set-name {
    color: var(--helper-text-color);
    font-size: 1.25rem;
    margin: 0.5rem 0 0;
    font-weight: 500;
}

.form-card {
    background: var(--surface-color);
    border-radius: 16px;
    border: 1px solid var(--border-color);
    box-shadow: 0 4px 12px var(--shadow-color);
    overflow: hidden;
}

.form-section {
    padding: 2rem;
    border-bottom: 1px solid var(--border-color);
}

.form-section:last-child {
    border-bottom: none;
}

.section-title {
    color: var(--text-color);
    font-size: 1.25rem;
    font-weight: 600;
    margin: 0 0 1.5rem;
}

.subsection-title {
    color: var(--helper-text-color);
    font-size: 1.1rem;
    font-weight: 500;
    margin: 1.5rem 0 1rem;
}

.form-group {
    margin-bottom: 1.5rem;
}

.form-group:last-child {
    margin-bottom: 0;
}

label {
    display: block;
    color: var(--text-color);
    font-size: 0.95rem;
    margin-bottom: 0.5rem;
}

.form-control {
    width: 100%;
    padding: 0.75rem 1rem;
    border-radius: 12px;
    border: 1px solid var(--border-color);
    background: var(--bg-color);
    color: var(--text-color);
    font-size: 1rem;
    transition: all var(--transition-speed) ease;
}

.form-control:focus {
    outline: none;
    border-color: var(--primary-color);
    box-shadow: 0 0 0 2px var(--primary-color-hover);
}

textarea.form-control {
    resize: vertical;
    min-height: 100px;
}

.helper-text {
    display: block;
    color: var(--helper-text-color);
    font-size: 0.9rem;
    margin-top: 0.5rem;
}

.radio-group {
    display: grid;
    gap: 1rem;
    margin-bottom: 1.5rem;
}

.radio-option {
    cursor: pointer;
    display: flex;
    align-items: flex-start;
    gap: 1rem;
    padding: 1rem;
    border: 1px solid var(--border-color);
    border-radius: 12px;
    transition: all var(--transition-speed) ease;
}

.radio-option:hover {
    background: var(--bg-color);
}

.radio-option input[type="radio"] {
    width: 1.25rem;
    height: 1.25rem;
    margin-top: 0.25rem;
    border: 2px solid var(--border-color);
    border-radius: 50%;
    appearance: none;
    -webkit-appearance: none;
    transition: all var(--transition-speed) ease;
    position: relative;
    cursor: pointer;
}

.radio-option input[type="radio"]:checked {
    border-color: var(--primary-color);
    background: var(--primary-color);
}

.radio-option input[type="radio"]:checked::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 0.5rem;
    height: 0.5rem;
    background: white;
    border-radius: 50%;
}

.radio-content {
    flex: 1;
}

.radio-title {
    color: var(--text-color);
    font-weight: 500;
    margin-bottom: 0.25rem;
}

.radio-description {
    color: var(--helper-text-color);
    font-size: 0.9rem;
}

.conditional-section {
    margin-top: 1.5rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--border-color);
}

.date-field {
    margin-top: 1rem;
    animation: slideDown 0.3s ease;
}

.form-actions {
    padding: 2rem;
    display: flex;
    gap: 1rem;
}

.submit-btn,
.cancel-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.75rem 1.5rem;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 500;
    cursor: pointer;
    transition: all var(--transition-speed) ease;
    text-decoration: none;
}

.submit-btn {
    background: var(--primary-color);
    color: white;
    border: none;
    flex: 1;
}

.submit-btn:hover {
    background: var(--primary-color-hover);
    transform: var(--card-hover-transform);
}

.cancel-btn {
    background: var(--surface-color);
    color: var(--text-color);
    border: 1px solid var(--border-color);
}

.cancel-btn:hover {
    background: var(--bg-color);
    transform: var(--card-hover-transform);
}

@keyframes slideDown {
    from {
        opacity: 0;
        transform: translateY(-10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media (max-width: 768px) {
    .add-member-container {
        padding: 1rem;
    }

    .form-section {
        padding: 1.5rem;
    }

    .form-actions {
        padding: 1.5rem;
        flex-direction: column;
    }

    .submit-btn,
    .cancel-btn {
        width: 100%;
        justify-content: center;
    }
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    console.log("Page loaded, initializing Add Member form...");
    
    // Initialize form state
    toggleFields();

    // Populate alliances dynamically
    const allianceSelect = document.getElementById("alliance_id");
    fetch("/alliances/options")
        .then(response => response.json())
        .then(data => {
            data.forEach(alliance => {
                const option = document.createElement("option");
                option.value = alliance.id;
                option.textContent = alliance.name;
                allianceSelect.appendChild(option);
            });
        })
        .catch(error => console.error('Error fetching alliances:', error));

    // Add event listeners for release date precision
    document.querySelectorAll('input[name="release_date_precision"]').forEach(radio => {
        radio.addEventListener('change', toggleReleaseDatePrecision);
    });

    // Add event listeners for death date precision
    document.querySelectorAll('input[name="death_precision"]').forEach(radio => {
        radio.addEventListener('change', toggleDeathDatePrecision);
    });
});

function toggleFields() {
    const status = document.getElementById('status').value;
    const releaseDateField = document.getElementById('release_date_field');
    const deathDateField = document.getElementById('date_of_death_precision');

    releaseDateField.style.display = status === 'locked_up' ? 'block' : 'none';
    deathDateField.style.display = status === 'dead' ? 'block' : 'none';

    // Reset fields when hidden
    if (status !== 'locked_up') {
        document.getElementById('release_unknown_precision').checked = true;
        toggleReleaseDatePrecision();
    }
    if (status !== 'dead') {
        document.getElementById('death_unknown_precision').checked = true;
        toggleDeathDatePrecision();
    }
}

function toggleReleaseDatePrecision() {
    const precision = document.querySelector('input[name="release_date_precision"]:checked')?.value;
    const exactField = document.getElementById('release_exact_date_field');
    const yearField = document.getElementById('release_year_date_field');

    exactField.style.display = precision === 'exact' ? 'block' : 'none';
    yearField.style.display = precision === 'year' ? 'block' : 'none';

    // Clear fields when hidden
    if (precision !== 'exact') document.getElementById('release_date_exact').value = '';
    if (precision !== 'year') document.getElementById('release_date_year').value = '';
}

function toggleDeathDatePrecision() {
    const precision = document.querySelector('input[name="death_precision"]:checked')?.value;
    const exactField = document.getElementById('death_exact_date_field');
    const yearField = document.getElementById('death_year_date_field');

    exactField.style.display = precision === 'exact' ? 'block' : 'none';
    yearField.style.display = precision === 'year' ? 'block' : 'none';

    // Clear fields when hidden
    if (precision !== 'exact') document.getElementById('death_date_exact').value = '';
    if (precision !== 'year') document.getElementById('death_date_year').value = '';
}
</script>
{% endblock %}
