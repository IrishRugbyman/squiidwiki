{% extends "base.html" %}

{% block content %}
<h2>Calendar</h2>

<!-- Legend -->
<div class="legend">
    <div><span class="legend-color" style="background-color: green;"></span> Release Dates</div>
    <div><span class="legend-color" style="background-color: red;"></span> Death Dates</div>
    <div><span class="legend-color" style="background-color: black;"></span> Death Anniversaries</div>
</div>

<div id="calendar"></div>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const calendarEl = document.getElementById('calendar');
        const events = [
            {% for event in events %}
            {
                title: "{{ event.title }}",
                start: "{{ event.date }}",
                color: "{{ event.color }}"
            },
            {% endfor %}
        ];

        const calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'dayGridMonth',
            events: events,
            eventDidMount: function(info) {
                // Add a tooltip to each event
                info.el.setAttribute("title", info.event.title);
            }
        });

        calendar.render();
    });
</script>

<style>
    .legend {
        display: flex;
        gap: 20px;
        margin-bottom: 20px;
    }
    .legend-color {
        display: inline-block;
        width: 15px;
        height: 15px;
        margin-right: 5px;
    }
</style>
{% endblock %}
