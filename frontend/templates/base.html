<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="{{ url_for('static', path='icons/favicon.ico') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', path='icons/apple-touch-icon.png') }}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SquiidVault</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    {% block extra_styles %}{% endblock %}
</head>
<body>
    <header class="main-header">
        <div class="header-content">
            <div class="branding">
                <img src="{{ url_for('static', path='icons/favicon.ico') }}" alt="Logo" class="logo">
                <h1 class="site-title">SquiidVault</h1>
            </div>
            <nav class="main-nav">
                <a href="/" class="nav-link">🏚️ Home</a>
                <a href="/sets" class="nav-link">🏘️ Sets</a>
                <a href="/members" class="nav-link">👤 Members</a>
                <a href="/alliances" class="nav-link">🤝 Alliances</a>
                <div class="dropdown">
                    <a href="/calendar" class="nav-link dropdown-toggle">📅 Calendar <span class="dropdown-arrow">▼</span></a>
                    <div class="dropdown-content">
                        <a href="/calendar/events" class="nav-link">⏳ Events</a>
                    </div>
                </div>
            </nav>
            <button id="theme-toggle" aria-label="Toggle dark/light mode">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path class="sun" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
                    <path class="moon" d="M12 3a9 9 0 019 9m-9 9a9 9 0 01-9-9"></path>
                </svg>
            </button>
        </div>
    </header>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="main-footer">
        <div class="footer-content">
            <p>© {{ year }} SquiidVault. All rights reserved.</p>
        </div>
    </footer>

    <style>
    :root {
        --primary-color: #6a0dad;
        --primary-color-hover: #8c32ef;
        --text-color: #ffffff;
        --bg-color: #121212;
        --surface-color: #1e1e1e;
        --border-color: #2b2b2b;
        --error-color: #ff5252;
        --success-color: #4caf50;
        --helper-text-color: #aaa;
        --header-bg: rgba(18, 18, 18, 0.8);
        --header-border: #2d2d2d;
        --nav-hover: rgba(140, 50, 239, 0.1);
        --shadow-color: rgba(0, 0, 0, 0.2);
    }

    .light-theme {
        --primary-color: #6a0dad;
        --primary-color-hover: #8c32ef;
        --text-color: #333;
        --bg-color: #ff0000;
        --surface-color: #ffffff;
        --border-color: #ff0000;
        --error-color: #f44336;
        --success-color: #4caf50;
        --helper-text-color: #666;
        --header-bg: rgba(245, 245, 245, 0.8);
        --header-border: #eaeaea;
        --nav-hover: rgba(140, 50, 239, 0.1);
        --shadow-color: rgba(0, 0, 0, 0.1);
    }

    body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        transition: background-color 0.3s ease, color 0.3s ease;
    }

    .main-header {
        background-color: var(--header-bg);
        border-bottom: 1px solid var(--header-border);
        position: sticky;
        top: 0;
        z-index: 1000;
        backdrop-filter: blur(8px);
        transition: background-color 0.3s ease, box-shadow 0.3s ease;
    }

    .main-header.scrolled {
        box-shadow: 0 2px 8px var(--shadow-color);
    }

    .header-content {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0.5rem 1rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .branding {
        display: flex;
        align-items: center;
        gap: 0.75rem;
    }

    .logo {
        width: 32px;
        height: 32px;
        border-radius: 8px;
    }

    .site-title {
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--primary-color);
        margin: 0;
    }

    .main-nav {
        display: flex;
        align-items: center;
        gap: 0.5rem;
    }

    .nav-link {
        color: var(--text-color);
        text-decoration: none;
        padding: 0.75rem 1rem;
        border-radius: 8px;
        transition: all 0.2s ease;
        font-weight: 500;
    }

    .nav-link:hover {
        background-color: var(--nav-hover);
        transform: translateY(-1px);
    }

    .dropdown {
        position: relative;
    }

    .dropdown-content {
        display: none;
        position: absolute;
        background: var(--surface-color);
        box-shadow: 0 4px 12px var(--shadow-color);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        z-index: 1;
        top: 100%;
        left: 50%;
        transform: translateX(-50%);
        min-width: 150px;
        padding: 0.5rem;
    }

    .dropdown-content .nav-link {
        display: block;
        padding: 0.5rem 1rem;
    }

    .dropdown:hover .dropdown-content,
    .dropdown:focus-within .dropdown-content {
        display: block;
        animation: fadeIn 0.2s ease;
    }

    .dropdown-arrow {
        font-size: 0.8em;
        margin-left: 0.25rem;
        transition: transform 0.2s ease;
    }

    .dropdown:hover .dropdown-arrow {
        transform: rotate(180deg);
    }

    .main-content {
        flex: 1;
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        padding: 2rem 1rem;
        box-sizing: border-box;
    }

    .main-footer {
        background-color: var(--surface-color);
        border-top: 1px solid var(--border-color);
        padding: 1.5rem 0;
        margin-top: auto;
    }

    .footer-content {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 1rem;
        text-align: center;
        color: var(--helper-text-color);
    }

    #theme-toggle {
        background-color: transparent;
        border: 1px solid var(--border-color);
        color: var(--text-color);
        width: 40px;
        height: 40px;
        border-radius: 8px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s ease;
    }

    #theme-toggle:hover {
        background-color: var(--nav-hover);
        transform: translateY(-1px);
    }

    #theme-toggle svg {
        width: 20px;
        height: 20px;
    }

    .light-theme .moon {
        display: block;
    }

    .light-theme .sun {
        display: none;
    }

    .sun {
        display: block;
    }

    .moon {
        display: none;
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(-10px) translateX(-50%);
        }
        to {
            opacity: 1;
            transform: translateY(0) translateX(-50%);
        }
    }

    @media (max-width: 768px) {
        .header-content {
            flex-direction: column;
            gap: 1rem;
            padding: 1rem;
        }

        .main-nav {
            flex-wrap: wrap;
            justify-content: center;
        }

        .nav-link {
            padding: 0.5rem 0.75rem;
            font-size: 0.9rem;
        }

        #theme-toggle {
            position: absolute;
            top: 1rem;
            right: 1rem;
        }
    }
    </style>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        // Theme toggle functionality
        const themeToggle = document.getElementById('theme-toggle');
        const prefersDarkScheme = window.matchMedia('(prefers-color-scheme: dark)');

        // Check for saved theme preference or use system preference
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'light') {
            document.body.classList.add('light-theme');
        } else if (!savedTheme && !prefersDarkScheme.matches) {
            document.body.classList.add('light-theme');
        }

        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('light-theme');
            const theme = document.body.classList.contains('light-theme') ? 'light' : 'dark';
            localStorage.setItem('theme', theme);
        });

        // Header scroll effect
        let lastScroll = 0;
        const header = document.querySelector('.main-header');

        window.addEventListener('scroll', () => {
            const currentScroll = window.pageYOffset;
            header.classList.toggle('scrolled', currentScroll > 50);
            lastScroll = currentScroll;
        });
    });
    </script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
