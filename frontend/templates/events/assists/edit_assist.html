{% extends 'base.html' %}

{% block content %}
<div class="container">
    <h1>Edit Assist Event</h1>
    <form method="post" action="/events/assists/edit/{{ assist.id }}" id="edit-assist-form" novalidate>
        <!-- CSRF Protection -->

        <fieldset class="form-section">
            <legend>Event Details</legend>
            <div class="form-row">
                <div class="form-group">
                    <label for="shooter_id">Shooter:</label>
                    <select id="shooter_id" name="shooter_id" required aria-required="true">
                        {% for member in all_members %}
                            <option value="{{ member.id }}" {% if member.id == assist.shooter_id %}selected{% endif %}>
                                {{ member.name }}
                            </option>
                        {% endfor %}
                    </select>
                    <div id="shooter-error" class="error-message" aria-live="polite"></div>
                </div>

                <div class="form-group">
                    <label for="victim_name">Victim:</label>
                    <input type="text" id="victim_name" value="{{ assist.victim.name }}" disabled>
                    <input type="hidden" name="victim_id" value="{{ assist.victim_id }}">
                    <small class="helper-text">Victim cannot be changed</small>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="date_display">Date:</label>
                    <input type="text" id="date_display" value="{{ assist.date.strftime('%Y-%m-%d') if assist.date else 'Unknown' }}" disabled>
                    <small class="helper-text">Date is linked to the murder and cannot be changed</small>
                </div>

                <div class="form-group">
                    <label for="assist_type">Assist Type:</label>
                    <select id="assist_type" name="assist_type" required aria-required="true">
                        <option value="driver" {% if assist.assist_type == 'driver' %}selected{% endif %}>Driver</option>
                        <option value="spotter" {% if assist.assist_type == 'spotter' %}selected{% endif %}>Spotter</option>
                        <option value="setup" {% if assist.assist_type == 'setup' %}selected{% endif %}>Setup</option>
                        <option value="other" {% if assist.assist_type == 'other' %}selected{% endif %}>Other</option>
                    </select>
                    <div id="type-error" class="error-message" aria-live="polite"></div>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group full-width">
                    <label for="notes">Notes:</label>
                    <textarea id="notes" name="notes" rows="3">{{ assist.notes }}</textarea>
                    <small class="helper-text">Additional details about the assist (optional)</small>
                </div>
            </div>
        </fieldset>

        <div class="form-actions">
            <a href="/members/{{ assist.shooter_id }}" class="secondary-button">Cancel</a>
            <button type="submit" id="submit-button">
                <span class="button-text">Save Changes</span>
                <span class="spinner hidden"></span>
            </button>
        </div>
    </form>
</div>

<style>
.container {
    max-width: 800px;
    margin: 0 auto;
    padding: 20px;
}

h1 {
    color: var(--primary-color);
    text-align: center;
    margin-bottom: 30px;
}

.form-section {
    background-color: var(--bg-color);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 20px;
}

legend {
    color: var(--primary-color);
    font-weight: bold;
    padding: 0 10px;
}

.form-row {
    display: flex;
    gap: 20px;
    margin-bottom: 15px;
}

.form-group {
    flex: 1;
}

.full-width {
    width: 100%;
}

label {
    display: block;
    margin-bottom: 5px;
    color: var(--text-color);
}

input, select, textarea {
    width: 100%;
    padding: 8px;
    border: 1px solid var(--border-color);
    border-radius: 4px;
    background-color: var(--input-bg);
    color: var(--text-color);
}

select {
    background-color: var(--input-bg);
    color: var(--text-color);
    appearance: auto;
}

select option {
    background-color: #2b2b2b !important;
    color: #ffffff !important;
    padding: 8px 12px;
}

textarea {
    resize: vertical;
    min-height: 80px;
}

input:disabled {
    background-color: var(--border-color);
    cursor: not-allowed;
}

.helper-text {
    font-size: 0.85em;
    color: var(--helper-text-color);
    margin-top: 4px;
}

.error-message {
    color: var(--error-color);
    font-size: 0.85em;
    margin-top: 4px;
    min-height: 20px;
}

.form-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 20px;
}

button, .secondary-button {
    padding: 10px 20px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 1em;
    display: flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
}

button[type="submit"] {
    background-color: var(--primary-color);
    color: white;
    border: none;
}

button[type="submit"]:hover {
    background-color: var(--primary-color-hover);
}

.secondary-button {
    background-color: transparent;
    border: 1px solid var(--border-color);
    color: var(--text-color);
}

.secondary-button:hover {
    background-color: rgba(255, 255, 255, 0.1);
}

.spinner {
    width: 16px;
    height: 16px;
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-radius: 50%;
    border-top-color: white;
    animation: spin 0.8s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

.hidden {
    display: none;
}

@media (max-width: 600px) {
    .form-row {
        flex-direction: column;
        gap: 15px;
    }
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('edit-assist-form');
    const submitButton = document.getElementById('submit-button');
    const spinner = document.querySelector('.spinner');
    const buttonText = document.querySelector('.button-text');
    const shooterError = document.getElementById('shooter-error');
    const typeError = document.getElementById('type-error');

    function validateForm() {
        let isValid = true;
        const shooter = document.getElementById('shooter_id').value;
        const assistType = document.getElementById('assist_type').value;

        // Clear previous errors
        shooterError.textContent = '';
        typeError.textContent = '';

        if (!shooter) {
            shooterError.textContent = 'Shooter is required';
            isValid = false;
        }

        if (!assistType) {
            typeError.textContent = 'Assist type is required';
            isValid = false;
        }

        return isValid;
    }

    form.addEventListener('submit', async function(event) {
        event.preventDefault();

        if (!validateForm()) {
            return;
        }

        // Show loading state
        submitButton.disabled = true;
        spinner.classList.remove('hidden');
        buttonText.textContent = 'Saving...';

        try {
            await form.submit();
        } catch (error) {
            console.error('Error submitting form:', error);
            submitButton.disabled = false;
            spinner.classList.add('hidden');
            buttonText.textContent = 'Save Changes';
        }
    });
});
</script>
{% endblock %}
