<html>
<head>
    <title>Edit Set</title>
    <!-- Include Tagify CSS -->
    <link href="https://cdn.jsdelivr.net/npm/@yaireo/tagify/dist/tagify.css" rel="stylesheet" type="text/css">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 0;
        }

        .error-banner {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(18, 18, 18, 0.95); /* Slightly transparent dark background */
            color: #ff4444; /* Red color for error message */
            font-size: 1.5em;
            text-align: center;
            z-index: 1000; /* Ensure it's on top of everything */
        }

        .error-banner a {
            color: #6a0dad; /* Purple color for the link */
            text-decoration: none;
            margin-top: 20px;
            font-size: 1em;
        }

        .error-banner a:hover {
            text-decoration: underline;
        }

        h1 {
            text-align: center;
            color: #6a0dad;
            margin-top: 10px;
            font-size: 2.5em;
            font-weight: 700;
        }

        #edit-set-form {
            display: flex;
            flex-direction: column;
            gap: 20px; /* Space between rows */
            max-width: 1200px; /* Limit form width */
            margin: 0 auto; /* Center the form */
            padding: 20px; /* Add some padding */
        }

        .form-row {
            display: flex;
            justify-content: space-between; /* Distribute space between elements */
            align-items: center; /* Ensure all elements are vertically aligned */
            gap: 10px; /* Space between elements in a row */
        }

        .form-row button[type="submit"] {
            flex-shrink: 0; /* Prevent the button from shrinking */
        }

        .form-row label,
        .form-row input[type="checkbox"] {
            margin-left: 10px; /* Optional: adds some space between the label and input */
            flex-shrink: 0; /* Prevent shrinking */
        }

        #edit-set-form label {
            font-size: 1.1em;
            color: #e0e0e0;
            white-space: nowrap; /* Prevent labels from wrapping */
        }

        #edit-set-form input[type="text"],
        #edit-set-form textarea,
        #edit-set-form .tagify {
            padding: 10px;
            border: 1px solid #444;
            border-radius: 5px;
            background-color: #121212;
            color: #e0e0e0;
            font-size: 1em;
            transition: border-color 0.3s ease;
            flex: 1; /* Allow inputs to grow and fill space */
        }

        #edit-set-form textarea {
            resize: vertical;
            min-height: 40px; /* Smaller height for textarea */
        }

        #edit-set-form input:focus,
        #edit-set-form textarea:focus,
        #edit-set-form .tagify:focus {
            border-color: #6a0dad;
            outline: none;
        }

        #edit-set-form button[type="submit"] {
            padding: 10px 20px;
            background-color: #6a0dad;
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 1.1em;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
            white-space: nowrap; /* Prevent button text from wrapping */
        }

        #edit-set-form button[type="submit"]:hover {
            background-color: #8c32ef;
            transform: translateY(-2px);
        }

        #edit-set-form button[type="submit"]:active {
            transform: translateY(0);
        }

        @media (max-width: 768px) {
            .form-row {
                flex-direction: column; /* Stack elements vertically on small screens */
                align-items: stretch;
            }

            #edit-set-form label {
                text-align: left; /* Align labels to the left */
            }

            #edit-set-form input[type="text"],
            #edit-set-form textarea,
            #edit-set-form .tagify {
                width: 100%; /* Full width on small screens */
            }

            #edit-set-form button[type="submit"] {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="error-banner" {% if not is_default_set %}style="display: none;"{% endif %}>
        ⚠️ System Set Protection: This is a protected system set and cannot be modified.
        <a href="/sets" class="back-link">← Return to Sets List</a>
    </div>

    <h1>EDIT SET</h1>
    <form method="post" action="/sets/edit/{{ set.id }}" id="edit-set-form">
        <div class="form-row">
            <button type="submit">Save Changes</button>
            <div style="display: flex; align-items: center;">
                <label for="is_extinct">Is Extinct:</label>
                <input type="checkbox" id="is_extinct" name="is_extinct" {% if set.type == "extinct" %}checked{% endif %}>
            </div>
        </div>
        <div class="form-row">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="Set name" value="{{ set.name }}" required>

            <label for="description">Description:</label>
            <textarea id="description" name="description" placeholder="Description">{{ set.description }}</textarea>
        </div>

        <div class="form-row">
            <label for="allies">Allies:</label>
            <input id="allies" name="allies" value="{{ allies }}" placeholder="Add allies">

            <label for="enemies">Enemies:</label>
            <input id="enemies" name="enemies" value="{{ enemies }}" placeholder="Add enemies">
        </div>
    </form>

    <!-- Include Tagify JS -->
    <script src="https://cdn.jsdelivr.net/npm/@yaireo/tagify"></script>
    <script src="https://cdn.jsdelivr.net/npm/@yaireo/tagify/dist/tagify.polyfills.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            var alliesInput = document.getElementById('allies');
            var enemiesInput = document.getElementById('enemies');

            var tagifyAllies = new Tagify(alliesInput, {
                whitelist: [],
                dropdown: {
                    enabled: 0,
                    maxItems: 5,
                    highlightFirst: true
                }
            });

            var tagifyEnemies = new Tagify(enemiesInput, {
                whitelist: [],
                dropdown: {
                    enabled: 0,
                    maxItems: 5,
                    highlightFirst: true
                }
            });

            function populateWhitelist(tagifyInstance, url) {
                fetch(url)
                    .then(response => response.json())
                    .then(data => {
                        tagifyInstance.settings.whitelist = data.map(item => item.name);
                    })
                    .catch(console.error);
            }

            populateWhitelist(tagifyAllies, "/sets/set_options?exclude={{ set.id }}");
            populateWhitelist(tagifyEnemies, "/sets/set_options?exclude={{ set.id }}");

            // Ensure form inputs get updated with Tagify values on submit
            document.getElementById('edit-set-form').addEventListener('submit', function (event) {
                var allies = tagifyAllies.value.map(tag => tag.value);
                var enemies = tagifyEnemies.value.map(tag => tag.value);

                // Check if a set is its own ally or enemy
                if (allies.includes("{{ set.name }}") || enemies.includes("{{ set.name }}")) {
                    alert("A set cannot be its own ally or enemy.");
                    event.preventDefault();
                    return;
                }

                // Check if a set is both an ally and enemy of the same set
                var commonSets = allies.filter(value => enemies.includes(value));
                if (commonSets.length > 0) {
                    alert("A set cannot be both an ally and enemy of the same set.");
                    event.preventDefault();
                    return;
                }

                alliesInput.value = allies.join(",");
                enemiesInput.value = enemies.join(",");
            });
        });
    </script>
</body>
</html>
