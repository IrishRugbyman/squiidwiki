{% block content %} <!-- Start the content block -->
<html>
<head>
    <title>Add a Set</title>
    <!-- Include Tagify CSS -->
    <link href="https://cdn.jsdelivr.net/npm/@yaireo/tagify/dist/tagify.css" rel="stylesheet" type="text/css">
    <style>
        /* Add the updated CSS here */
    </style>
</head>
<body>
    <h1>Add a New Set</h1>
    <form method="post" action="/sets/add" id="add-set-form">
        <div class="form-row">
            <label for="is_extinct">Is Extinct:</label>
            <input type="checkbox" id="is_extinct" name="is_extinct">
        </div>
        <div class="form-row">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="Set name" required>

            <label for="description">Description:</label>
            <textarea id="description" name="description" placeholder="Description"></textarea>
        </div>

        <div class="form-row">
            <label for="allies">Allies:</label>
            <input id="allies" name="allies" placeholder="Add allies">

            <label for="enemies">Enemies:</label>
            <input id="enemies" name="enemies" placeholder="Add enemies">
        </div>

        <div class="form-row">
            <button type="submit">Add Set</button>
        </div>
    </form>


    <!-- Include Tagify JS -->
    <script src="https://cdn.jsdelivr.net/npm/@yaireo/tagify"></script>
    <script src="https://cdn.jsdelivr.net/npm/@yaireo/tagify/dist/tagify.polyfills.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            var alliesInput = document.getElementById('allies');
            var tagifyAllies = new Tagify(alliesInput, {
                whitelist: [],
                dropdown: {
                    enabled: 1,
                    maxItems: 5,
                    highlightFirst: true
                }
            });

            var enemiesInput = document.getElementById('enemies');
            var tagifyEnemies = new Tagify(enemiesInput, {
                whitelist: [],
                dropdown: {
                    enabled: 1,
                    maxItems: 5,
                    highlightFirst: true
                }
            });

            function populateWhitelist(tagifyInstance, url) {
                fetch(url)
                    .then(response => response.json())
                    .then(data => {
                        tagifyInstance.settings.whitelist = data.map(item => item.name);
                        tagifyInstance.dropdown.show.call(tagifyInstance);
                    })
                    .catch(console.error);
            }

            populateWhitelist(tagifyAllies, "/sets/set_options");
            populateWhitelist(tagifyEnemies, "/sets/set_options");

            document.getElementById('add-set-form').addEventListener('submit', function () {
                document.getElementById('allies').value = tagifyAllies.value.map(tag => tag.value).join(",");
                document.getElementById('enemies').value = tagifyEnemies.value.map(tag => tag.value).join(",");
            });
        });
    </script>
</body>
</html>
{% endblock %} <!-- End the content block -->
<style>
    body {
        font-family: 'Roboto', sans-serif;
        background-color: #121212;
        color: #e0e0e0;
        margin: 0;
        padding: 0;
    }

    h1 {
        text-align: center;
        color: #6a0dad;
        margin-bottom: 10px;
        font-size: 2.5em;
        font-weight: 700;
    }

    #add-set-form {
        display: flex;
        flex-direction: column;
        gap: 20px; /* Space between rows */
        max-width: 1200px; /* Limit form width */
        margin: 0 auto; /* Center the form */
        padding: 20px; /* Add some padding */
    }

    .form-row {
        display: flex;
        align-items: center;
        gap: 10px; /* Space between elements in a row */
    }

    #add-set-form label {
        font-size: 1.1em;
        color: #e0e0e0;
        white-space: nowrap; /* Prevent labels from wrapping */
    }

    #add-set-form input[type="text"],
    #add-set-form textarea,
    #add-set-form .tagify {
        padding: 10px;
        border: 1px solid #444;
        border-radius: 5px;
        background-color: #121212;
        color: #e0e0e0;
        font-size: 1em;
        transition: border-color 0.3s ease;
        flex: 1; /* Allow inputs to grow and fill space */
    }

    #add-set-form textarea {
        resize: vertical;
        min-height: 40px; /* Smaller height for textarea */
    }

    #add-set-form input:focus,
    #add-set-form textarea:focus,
    #add-set-form .tagify:focus {
        border-color: #6a0dad;
        outline: none;
    }

    #add-set-form button[type="submit"] {
        padding: 10px 20px;
        background-color: #6a0dad;
        border: none;
        border-radius: 5px;
        color: white;
        font-size: 1.1em;
        cursor: pointer;
        transition: background-color 0.3s ease, transform 0.2s ease;
        white-space: nowrap; /* Prevent button text from wrapping */
    }

    #add-set-form button[type="submit"]:hover {
        background-color: #8c32ef;
        transform: translateY(-2px);
    }

    #add-set-form button[type="submit"]:active {
        transform: translateY(0);
    }

    @media (max-width: 768px) {
        .form-row {
            flex-direction: column; /* Stack elements vertically on small screens */
            align-items: stretch;
        }

        #add-set-form label {
            text-align: left; /* Align labels to the left */
        }

        #add-set-form input[type="text"],
        #add-set-form textarea,
        #add-set-form .tagify {
            width: 100%; /* Full width on small screens */
        }

        #add-set-form button[type="submit"] {
            width: 100%;
        }
    }
</style>
