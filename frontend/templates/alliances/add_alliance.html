{% extends "base.html" %}

{% block content %}
<div class="add-alliance-container">
    <h2 class="page-title">Add New Alliance</h2>
    <form action="/alliances/add" method="post">
        <div class="form-group">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
        </div>
        <div class="form-group">
            <label for="description">Description:</label>
            <textarea id="description" name="description"></textarea>
        </div>
        <div class="form-group">
            <label for="status">Status:</label>
            <select id="status" name="status">
                <option value="active">Active</option>
                <option value="inactive">Inactive</option>
            </select>
        </div>
        <button type="submit" class="submit-button">Add Alliance</button>
    </form>
</div>

<style>
    .add-alliance-container {
        max-width: 800px;
        margin: 2rem auto;
        padding: 1rem;
        background: #1e1e1e;
        border-radius: 8px;
    }

    .page-title {
        color: #e0e0e0;
        font-size: 2rem;
        margin-bottom: 1rem;
    }

    .form-group {
        margin-bottom: 1rem;
    }

    label {
        color: #e0e0e0;
        font-size: 1rem;
        display: block;
        margin-bottom: 0.5rem;
    }

    input, textarea, select {
        width: 100%;
        padding: 0.5rem;
        border-radius: 4px;
        border: 1px solid #444;
        background: #2a2a2a;
        color: #e0e0e0;
    }

    .submit-button {
        padding: 0.5rem 1rem;
        border-radius: 4px;
        background-color: #4CAF50;
        color: white;
        font-size: 1rem;
        cursor: pointer;
    }

    .submit-button:hover {
        background-color: #45a049;
    }
</style>
{% endblock %}
