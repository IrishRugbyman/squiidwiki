{% extends "base.html" %}

{% block content %}
<h2>{{ alliance[1] }}</h2>
<p><strong>Description:</strong> {{ alliance[2] }}</p>

<h3>Sets in this Alliance</h3>
<ul>
    {% for set in sets %}
    <li><a href="/sets/{{ set[0] }}">{{ set[1] }}</a></li>
    {% endfor %}
</ul>

<a href="/alliances/edit/{{ alliance[0] }}">Edit</a>
<form action="/alliances/delete/{{ alliance[0] }}" method="POST" style="display: inline;">
    <button type="submit" onclick="return confirm('Are you sure you want to delete this alliance?')">Delete</button>
</form>

<a href="/alliances">Back to Alliances</a>
{% endblock %}
