{% extends "base.html" %}

{% block content %}
<h2>Edit Alliance</h2>
<form method="POST">
    <label for="name">Name:</label>
    <input type="text" id="name" name="name" value="{{ alliance[1] }}" required>
    <br>

    <label for="description">Description:</label>
    <textarea id="description" name="description">{{ alliance[2] }}</textarea>
    <br>

    <button type="submit">Save Changes</button>
</form>
{% endblock %}
