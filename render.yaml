services:
  - type: web
    name: squiidwiki
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: false
      - key: POSTGRES_DB
        value: squiidvault
      - key: POSTGRES_HOST
        fromService:
          type: postgres
          name: squiidwiki-db
          property: host
      - key: POSTGRES_PORT
        value: 5432
      - key: POSTGRES_USER
        fromService:
          type: postgres
          name: squiidwiki-db
          property: user
      - key: POSTGRES_PASSWORD
        fromService:
          type: postgres
          name: squiidwiki-db
          property: password
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: PORT
        fromService:
          type: web
          name: squiidwiki
          envVarKey: PORT
      - key: TEST_MODE
        value: 0
      - key: AUTH_BYPASS_ENABLED
        value: false
    healthCheckPath: /health

  - type: postgres
    name: squiidwiki-db
    plan: free
    ipAllowList: [] 